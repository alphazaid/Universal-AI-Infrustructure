name: PAI Codex Validation

on:
  workflow_dispatch:
  push:
    branches:
      - pai-codex-flawless-runtime
      - pai-codex-windows-installer
  # pull_request paths deliberately narrowed to this file only: the validation
  # suite targets the pre-LifeOS-restructure layout (Releases/v5.0.0/.claude/PAI),
  # which the upstream sync removed — running it on content PRs is pure noise
  # until the suite is ported (Phase-2 rename work). Manual runs: workflow_dispatch.
  pull_request:
    paths:
      - ".github/workflows/pai-codex-validation.yml"

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Run Codex branch validation (non-blocking — suite predates LifeOS restructure)
        # The upstream-sync merge moved Releases/v5.0.0/.claude/PAI/** →
        # LifeOS/install/LIFEOS/**. This suite still validates the OLD layout
        # (relative-root math + references to PAI/TOOLS/pai.ts, PAI-Install/,
        # bin/llcli/, Releases/v5.0.0/README.md — none exist post-restructure).
        # Porting it is part of the Phase-2 rename work (see PR notes), so it
        # reports but does not block until then. push-branch triggers on the
        # legacy branches are unaffected (they use their own workflow copy).
        continue-on-error: true
        run: bun LifeOS/install/LIFEOS/TOOLS/CodexBranchValidation.ts
